<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>09 — Яагаад KUMA</title>
<link rel="stylesheet" href="../brand.css">
<style>
  .poster { background: radial-gradient(90% 60% at 80% 90%, #3b23a8 0%, var(--night) 55%, var(--abyss) 100%); }
  h1 { position: absolute; left: var(--margin); top: 132px; font-size: 100px; }
  .sub { position: absolute; left: var(--margin); top: 366px; width: 600px; font-size: 28px; color: rgba(255, 255, 255, 0.75); }
  /* grade staircase 6 → 12 */
  .stairs { position: absolute; left: 0; right: 0; bottom: 0; height: 1350px; }
  .stair { position: absolute; bottom: 0; width: 155px; border-top-left-radius: 0; display: flex; justify-content: center; padding-top: 18px;
    font-size: 64px; color: var(--ink); box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.35), inset -10px 0 0 rgba(25, 21, 46, 0.12); }
  .bear { width: 170px; left: 914px; bottom: 530px; }
  .snip.chapter { width: 560px; left: var(--margin); top: 520px; border-radius: 24px; transform: rotate(-2deg); box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7), 0 0 80px rgba(122, 92, 245, 0.5); }
  .chips { position: absolute; left: var(--margin); top: 680px; display: flex; gap: 12px; }
  .label { position: absolute; left: var(--margin); bottom: 470px; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--lemon); }
</style>
</head>
<body>
<div class="poster">
  <header class="meta"><span class="mark lemon">KUMA</span></header>
  <h1 class="headline">Сурах бичгийнхээ<br><span class="lemon">сэдвээр.</span></h1>
  <p class="sub body">Анги бүрийн математикийн бүлэг, сэдвүүд апп дотор.</p>
  <div class="snip chapter" data-src="path.png" data-crop="12 68 366 88"></div>
  <div class="chips"><span class="chip glass"><img src="../../assets/sprites/icon_star.png" alt="">Суурь · Дунд · Ахисан</span><span class="chip glass"><img src="../../assets/sprites/icon_heart.png" alt="">Офлайн дасгал</span></div>
  <div class="label">6–12-р анги</div>
  <div class="stairs" id="stairs"></div>
  <img class="sprite bear" src="../../assets/sprites/bear_cheer_scarf.png" alt="">
  <footer class="signoff"><span></span><span class="url" style="color:var(--ink); opacity:.8">surgalt.pinequest-team1.workers.dev</span></footer>
</div>
<script>
  // seven steps, one per grade; colours walk from lavender to lemon
  const tones = ['#d9d2f2', '#cfd8ec', '#c9e2d4', '#d0ecb0', '#dcf28c', '#e9f57a', '#f3f66c'];
  const st = document.getElementById('stairs');
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('div');
    s.className = 'stair pixel';
    s.textContent = 6 + i;
    s.style.left = `${4 + i * 153}px`;
    s.style.height = `${150 + i * 64}px`;
    s.style.background = tones[i];
    st.appendChild(s);
  }
</script>
<script src="../kit.js"></script>
</body>
</html>
