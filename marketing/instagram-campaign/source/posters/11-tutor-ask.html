<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>11 — Баавгайтай ярилц</title>
<link rel="stylesheet" href="../brand.css">
<style>
  /* chalkboard green from the tutor classroom */
  .poster { background: radial-gradient(90% 70% at 70% 65%, #1f6b45 0%, #134a31 45%, #0a2a1c 100%); --grain: 0.12; }
  /* chalk smudges */
  .smudge { background:
      radial-gradient(30% 12% at 20% 30%, rgba(244, 241, 228, 0.07), transparent 70%),
      radial-gradient(26% 10% at 80% 18%, rgba(244, 241, 228, 0.06), transparent 70%),
      radial-gradient(40% 14% at 40% 88%, rgba(244, 241, 228, 0.05), transparent 70%); }
  h1 { position: absolute; left: var(--margin); top: 140px; font-size: 100px; color: #f4f1e4; text-shadow: 0 0 18px rgba(244, 241, 228, 0.25); }
  .sub { position: absolute; left: var(--margin); top: 372px; width: 440px; font-size: 28px; color: rgba(244, 241, 228, 0.78); }
  .phone.p { --pw: 380px; left: 610px; top: 300px; transform: rotate(5deg); }
  /* the kid's voice: pixel sound bars */
  .wave { position: absolute; left: var(--margin); top: 640px; display: flex; gap: 10px; align-items: center; height: 150px; }
  .wave i { width: 18px; background: var(--lime); box-shadow: 0 0 22px rgba(212, 245, 94, 0.45); }
  .mic { position: absolute; left: var(--margin); top: 850px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { position: relative; max-width: 470px; padding: 22px 26px; border-radius: 26px 26px 26px 8px; background: #fff; color: var(--ink);
    font-size: 26px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.6); }
  .bubble small { display: block; margin-bottom: 6px; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--violet); }
  .snip.status { width: 330px; left: var(--margin); top: 1040px; border-radius: 999px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<div class="poster">
  <div class="layer smudge"></div>
  <header class="meta"><span class="mark lemon">KUMA</span></header>
  <h1 class="headline">Баавгайгаас<br><span class="lemon">асуу.</span></h1>
  <p class="sub body">Алдсан бодлогоо баавгайтай дуугаар ярилц. Тэр самбар дээр бичээд тайлбарлана.</p>
  <div class="wave" id="wave"></div>
  <div class="mic">
    <div class="bubble"><small>Чи</small>Модуль гэдэг нь тоо тэгээс хэр хол байгааг хэлдэг юм уу?</div>
  </div>
  <div class="phone p" data-src="tutor-listen.png" data-sb="#f3d2a9"></div>
  <footer class="signoff" style="color:#f4f1e4"><span></span><span class="url">surgalt.pinequest-team1.workers.dev</span></footer>
</div>
<script>
  // a voice level meter drawn as pixel bars
  const levels = [22, 40, 70, 54, 96, 130, 88, 112, 64, 140, 100, 58, 82, 36, 60, 28, 44, 18];
  document.getElementById('wave').innerHTML = levels.map((h) => `<i style="height:${h}px"></i>`).join('');
</script>
<script src="../kit.js"></script>
</body>
</html>
