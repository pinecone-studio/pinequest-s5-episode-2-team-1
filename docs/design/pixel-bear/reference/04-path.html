<style>
body{margin:0}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
@keyframes hop{0%,40%,100%{transform:translateY(0) scale(1,1)}46%{transform:translateY(2px) scale(1.06,.92)}56%{transform:translateY(-22px) scale(.95,1.06)}66%{transform:translateY(0) scale(1.07,.92)}72%{transform:translateY(0) scale(1,1)}}
@keyframes blink{0%,88%,94%,100%{opacity:0}89%,93%{opacity:1}}
@keyframes ring{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes arrow{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-8deg)}82%{transform:rotate(8deg)}88%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes driftA{0%{transform:translateX(-90px)}100%{transform:translateX(470px)}}
@keyframes driftB{0%{transform:translateX(420px)}100%{transform:translateX(-80px)}}
@keyframes flap{0%{background-position:0 0}100%{background-position:-28px 0}}
@keyframes flyA{0%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(90px,-10px)}75%{transform:translate(50px,20px)}100%{transform:translate(0,0)}}
@keyframes flyB{0%{transform:translate(0,0)}33%{transform:translate(-50px,-24px)}66%{transform:translate(-20px,26px)}100%{transform:translate(0,0)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.5)}}
.hop{animation:hop 2.8s ease-in-out infinite;transform-origin:50% 100%}
.blink{animation:blink 3.6s steps(1) infinite}
.ring{animation:ring 1.6s ease-in-out infinite}
.arrow{animation:arrow 1s steps(2) infinite}
.bob{animation:bob 1.6s steps(4) infinite}
.wiggle{animation:wiggle 3s ease-in-out infinite;transform-origin:50% 100%}
.sway{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
.cloudA{animation:driftA 38s linear infinite}
.cloudB{animation:driftB 52s linear infinite}
.bfly{width:14px;height:10px;background:url(/sprites/map_butterfly_sheet.png) 0 0/28px 10px no-repeat;image-rendering:pixelated;animation:flap .32s steps(2) infinite}
.flyA{animation:flyA 9s ease-in-out infinite}
.flyB{animation:flyB 7s ease-in-out infinite}
.tw{animation:twinkle 1.6s ease-in-out infinite}
.tw2{animation:twinkle 1.6s ease-in-out .8s infinite}
@media (prefers-reduced-motion: reduce){.hop,.blink,.ring,.arrow,.bob,.wiggle,.sway,.cloudA,.cloudB,.bfly,.flyA,.flyB,.tw,.tw2{animation:none}}
.cta:focus-visible{outline:3px solid #7A5CF5;outline-offset:2px}
</style>
