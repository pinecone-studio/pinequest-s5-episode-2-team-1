<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Нүүр</title>
<!-- design-canvas runtime removed: {{hole}} values come from renderVals() in the script at the bottom; <sc-if>/<sc-for> are template conditionals/loops -->
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.975)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.22}50%{transform:scaleX(.72);opacity:.12}}
.float{animation:float 2.6s ease-in-out infinite}
.bob{animation:bob 1.6s ease-in-out infinite}
.breathe{animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
.sway{animation:sway 2.8s ease-in-out infinite;transform-origin:50% 100%}
.sh-float{animation:shadow 2.6s ease-in-out infinite}
.tw{animation:twinkle 1.8s ease-in-out infinite}
.tw2{animation:twinkle 1.8s ease-in-out .7s infinite}
.drip{animation:drop 1.4s ease-in infinite}
@media (prefers-reduced-motion: reduce){.float,.bob,.breathe,.sway,.tw,.tw2,.drip,.sh-float{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEEE9; font-family: 'Onest', system-ui, sans-serif; color: #19152E;">
  <div style="position: absolute; left: 20px; right: 20px; top: 54px; display: flex; align-items: center; gap: 8px;">
    <a href="08-calendar.html" aria-label="Профайл ба хуанли" style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #7A5CF5; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;">
      <img class="px" src="/sprites/head_idle.png" alt="" style="width: 49px; height: 42px;">
    </a>
    <div style="height: 44px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 7px;">
      <img class="px" src="/sprites/icon_star.png" alt="" style="width: 22px; height: 22px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 16px; line-height: 1;">1 240 XP</span>
        <div style="width: 70px; height: 4px; border-radius: 2px; background: #E6E3F5;"><div style="width: 46px; height: 4px; border-radius: 2px; background: #7A5CF5;"></div></div>
      </div>
    </div>
    <div style="flex: 1;"></div>
    <div style="height: 44px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px;">
      <img class="px" src="/sprites/icon_flame.png" alt="Streak" style="width: 22px; height: 22px;">
      <span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 17px;">12</span>
    </div>
    <div style="height: 44px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px;">
      <img class="px" src="/sprites/icon_coin.png" alt="Coin" style="width: 22px; height: 22px;">
      <span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 17px;">860</span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 118px; display: flex; flex-direction: column; gap: 2px;">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.6px;">Сайн уу, Тэмүүлэн</div>
    <div style="font-size: 15px; font-weight: 500; color: #5E5A6E;">{{mood}}</div>
  </div>

  <div style="position: absolute; left: 20px; top: 186px; width: 350px; height: 330px; border-radius: 32px; overflow: hidden; background: {{stageBg}};">
    <div style="position: absolute; left: 55px; top: 34px; width: 240px; height: 240px; border-radius: 50%; background: {{haloBg}};"></div>

    <sc-if value="{{isThriving}}" hint-placeholder-val="{{ true }}">
      <img class="px tw" src="/sprites/icon_star.png" alt="" style="position: absolute; left: 40px; top: 90px; width: 36px; height: 36px;">
      <img class="px tw2" src="/sprites/icon_star.png" alt="" style="position: absolute; left: 286px; top: 72px; width: 28px; height: 28px;">
      <img class="px tw2" src="/sprites/icon_heart.png" alt="" style="position: absolute; left: 60px; top: 210px; width: 30px; height: 30px;">
      <img class="px tw" src="/sprites/icon_coin.png" alt="" style="position: absolute; left: 270px; top: 196px; width: 30px; height: 30px;">
    </sc-if>
    <sc-if value="{{isHappy}}" hint-placeholder-val="{{ false }}">
      <img class="px tw" src="/sprites/icon_heart.png" alt="" style="position: absolute; left: 62px; top: 96px; width: 30px; height: 30px;">
      <img class="px tw2" src="/sprites/icon_heart.png" alt="" style="position: absolute; left: 266px; top: 120px; width: 24px; height: 24px;">
    </sc-if>
    <sc-if value="{{isTired}}" hint-placeholder-val="{{ false }}">
      <svg class="drip" aria-hidden="true" width="18" height="24" viewBox="0 0 6 8" style="position: absolute; left: 236px; top: 92px; image-rendering: pixelated;" shape-rendering="crispEdges"><rect x="2" y="0" width="2" height="2" fill="#7FC6EF"/><rect x="1" y="2" width="4" height="4" fill="#7FC6EF"/><rect x="2" y="6" width="2" height="1" fill="#7FC6EF"/><rect x="2" y="3" width="1" height="2" fill="#FFFFFF"/></svg>
      <div style="position: absolute; left: 252px; top: 64px; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 22px; color: {{decoInk}};">z<span style="font-size: 15px;">z</span></div>
    </sc-if>
    <sc-if value="{{isNeglected}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="96" height="72" viewBox="0 0 24 18" shape-rendering="crispEdges" style="position: absolute; left: 216px; top: 30px;">
        <rect x="6" y="2" width="8" height="2" fill="#8A8C94"/><rect x="4" y="4" width="14" height="2" fill="#8A8C94"/><rect x="2" y="6" width="20" height="4" fill="#8A8C94"/><rect x="4" y="10" width="16" height="2" fill="#73757D"/>
        <rect x="6" y="13" width="1" height="2" fill="#7FC6EF"/><rect x="11" y="14" width="1" height="2" fill="#7FC6EF"/><rect x="16" y="13" width="1" height="2" fill="#7FC6EF"/><rect x="8" y="16" width="1" height="2" fill="#7FC6EF"/><rect x="14" y="16" width="1" height="2" fill="#7FC6EF"/>
      </svg>
      <svg aria-hidden="true" width="24" height="18" viewBox="0 0 8 6" shape-rendering="crispEdges" style="position: absolute; left: 70px; top: 86px;"><rect x="0" y="0" width="3" height="2" fill="#FFFFFF" opacity="0.8"/><rect x="5" y="0" width="3" height="2" fill="#FFFFFF" opacity="0.8"/><rect x="2" y="2" width="4" height="3" fill="#19152E"/></svg>
    </sc-if>
    <sc-if value="{{isSleep}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 11 11" shape-rendering="crispEdges" style="position: absolute; left: 272px; top: 66px;"><rect x="3" y="0" width="4" height="1" fill="{{moon}}"/><rect x="1" y="1" width="4" height="2" fill="{{moon}}"/><rect x="0" y="3" width="4" height="4" fill="{{moon}}"/><rect x="1" y="7" width="5" height="2" fill="{{moon}}"/><rect x="3" y="9" width="6" height="1" fill="{{moon}}"/><rect x="7" y="8" width="3" height="1" fill="{{moon}}"/></svg>
      <img class="px tw" src="/sprites/icon_star.png" alt="" style="position: absolute; left: 44px; top: 80px; width: 24px; height: 24px;">
      <img class="px tw2" src="/sprites/icon_star.png" alt="" style="position: absolute; left: 92px; top: 150px; width: 18px; height: 18px;">
      <div style="position: absolute; left: 236px; top: 128px; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 26px; color: {{decoInk}};">Z<span style="font-size: 18px;">z</span></div>
    </sc-if>

    <div class="{{shadowAnim}}" style="position: absolute; left: 111px; top: 292px; width: 128px; height: 16px; border-radius: 50%; background: #19152E; opacity: 0.18;"></div>
    <div style="position: absolute; left: {{bearLeft}}px; top: {{bearTop}}px; width: {{bearW}}px; height: {{bearH}}px;">
      <img class="px {{anim}}" src="{{bearSrc}}" alt="{{bearAlt}}" style="display: block; width: {{bearW}}px; height: {{bearH}}px;">
    </div>

    <div style="position: absolute; left: 14px; top: 14px; height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: {{dot}};"></span>{{chip}}
    </div>
    <div style="position: absolute; right: 14px; top: 14px; height: 34px; box-sizing: border-box; padding: 0 12px 0 9px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 7px;">
      <img class="px" src="/sprites/icon_heart.png" alt="Энерги" style="width: 18px; height: 18px;">
      <div style="width: 52px; height: 6px; border-radius: 3px; background: #ECE9F6;"><div style="width: {{energyW}}px; height: 6px; border-radius: 3px; background: {{dot}};"></div></div>
      <span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 15px;">{{energy}}</span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 536px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.3px;">Өнөөдрийн даалгавар</div>
    <a href="04-path.html" style="font-size: 14px; font-weight: 700; color: #22106E; text-decoration: none;">1 / 3 · Бүгд</a>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 572px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 150px; box-sizing: border-box; padding: 14px 12px; border-radius: 24px; background: #D4F55E; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7;">Англи хэл</div>
      <div style="font-size: 16px; font-weight: 600; line-height: 1.15; text-decoration: line-through;">10 шинэ үг</div>
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #19152E; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4F55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Дууссан" role="img"><path d="M5 12.5 10 17.5 19 7"/></svg></div>
    </div>
    <div style="height: 150px; box-sizing: border-box; padding: 14px 12px; border-radius: 24px; background: #F2CDE0; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7;">Математик</div>
      <div style="font-size: 16px; font-weight: 600; line-height: 1.15;">Бутархай нэмэх</div>
      <div style="align-self: flex-start; height: 28px; box-sizing: border-box; padding: 0 9px 0 6px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 4px;"><img class="px" src="/sprites/icon_coin.png" alt="" style="width: 16px; height: 16px;"><span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 14px;">+30</span></div>
    </div>
    <div style="height: 150px; box-sizing: border-box; padding: 14px 12px; border-radius: 24px; background: #7A5CF5; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">Хэцүү</span><img class="px" src="/sprites/icon_mystery_box.png" alt="Item унах боломжтой" style="width: 28px; height: 22px;"></div>
      <div style="font-size: 16px; font-weight: 600; line-height: 1.15;">Гэрлийн хугарал</div>
      <div style="align-self: flex-start; height: 28px; box-sizing: border-box; padding: 0 9px 0 6px; border-radius: 999px; background: #FFFFFF; color: #19152E; display: flex; align-items: center; gap: 4px;"><img class="px" src="/sprites/icon_coin.png" alt="" style="width: 16px; height: 16px;"><span style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 14px;">+50</span></div>
    </div>
  </div>

  <nav aria-label="Үндсэн цэс" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 6px 12px 20px; background: #FFFFFF; border-top: 2px solid #E6E4DD; border-radius: 28px 28px 0 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="03-home.html" aria-label="Нүүр" aria-current="page" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><img class="px" src="/sprites/nav_home_on.png" alt="" style="width: 40px; height: 36px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #19152E;"></span></a>
    <a href="04-path.html" aria-label="Сурах зам" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><img class="px" src="/sprites/nav_path_off.png" alt="" style="width: 40px; height: 40px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: transparent;"></span></a>
    <a href="07-shop.html" aria-label="Дэлгүүр" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><img class="px" src="/sprites/nav_shop_off.png" alt="" style="width: 44px; height: 38px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: transparent;"></span></a>
    <a href="07-shop.html" aria-label="Цүнх" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><img class="px" src="/sprites/nav_bag_off.png" alt="" style="width: 40px; height: 40px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: transparent;"></span></a>
    <a href="09-bear-states-board.html" aria-label="Баг" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><img class="px" src="/sprites/nav_crew_off.png" alt="" style="width: 40px; height: 40px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: transparent;"></span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["thriving","happy","tired","neglected","sleep"],"default":"thriving","section":"Баавгай"},"bg":{"editor":"enum","options":["Нимбэг","Тал","Ягаан","Хөх тэнгэр","Лаванда","Говь","Улбар","Шөнө"],"default":"Нимбэг","section":"Баавгай"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'thriving';
    const S = {
      thriving: { src: '/sprites/bear_cheer_scarf.png', w: 180, h: 252, top: 30, bg: '#F3F66C', halo: 'rgba(255,255,255,0.55)', chip: 'Гэрэлтэж байна', dot: '#E0A82E', energy: 96, anim: 'float', sh: 'sh-float', mood: '7 хоног дараалан сурлаа. Баавгай чинь хөвж байна!', alt: 'Баярлан хөвж буй баавгай' },
      happy: { src: '/sprites/bear_idle_scarf.png', w: 164, h: 280, top: 18, bg: '#D4F55E', halo: 'rgba(255,255,255,0.5)', chip: 'Сэргэлэн', dot: '#4F9A57', energy: 74, anim: 'bob', sh: '', mood: 'Өнөөдрийн 3 даалгавраас 1-ийг хийлээ.', alt: 'Ороолттой зогсож буй баавгай' },
      tired: { src: '/sprites/bear_tired_scarf.png', w: 164, h: 280, top: 18, bg: '#D9D2F2', halo: 'rgba(255,255,255,0.45)', chip: 'Ядарсан', dot: '#7A5CF5', energy: 38, anim: 'breathe', sh: '', mood: 'Өчигдөр алгассан. Нэг хичээл хийгээд сэргээе.', alt: 'Ядарсан, нүдний доогуур бараантсан баавгай' },
      neglected: { src: '/sprites/bear_neglected_scarf.png', w: 164, h: 280, top: 18, bg: '#CBCAC1', halo: 'rgba(255,255,255,0.3)', chip: 'Сүнсгүй', dot: '#8A8C94', energy: 9, anim: 'sway', sh: '', mood: 'Streak тасарлаа. 2 хичээл хийвэл баавгай сэргэнэ.', alt: 'Хөхөрсөн нүдтэй, саарал болсон баавгай' },
      sleep: { src: '/sprites/bear_sleep.png', w: 190, h: 254, top: 46, bg: '#22106E', halo: 'rgba(122,92,245,0.45)', chip: 'Амарч байна', dot: '#AEDDF3', energy: 60, anim: 'breathe', sh: '', mood: 'Амралтын өдөр. Streak хамгаалагч ажиллаж байна.', alt: 'Хөнжил нөмөрч унтаж буй баавгай' }
    };
    const s = S[st] || S.thriving;
    const BG = { 'Нимбэг': '#F3F66C', 'Тал': '#A9D18E', 'Ягаан': '#F2CDE0', 'Хөх тэнгэр': '#9FD0F2', 'Лаванда': '#D9D2F2', 'Говь': '#EBCF9B', 'Улбар': '#F7A97E', 'Шөнө': '#22106E' };
    const bgName = this.props.bg ?? 'Нимбэг';
    const dark = bgName === 'Шөнө';
    return {
      bearSrc: s.src, bearW: s.w, bearH: s.h, bearTop: s.top, bearLeft: (350 - s.w) / 2,
      stageBg: BG[bgName] || BG['Нимбэг'], haloBg: dark ? 'rgba(122,92,245,0.45)' : 'rgba(255,255,255,0.5)', chip: s.chip, dot: s.dot,
      decoInk: dark ? '#FFFFFF' : '#19152E', moon: dark ? '#F3F66C' : '#FFFFFF',
      energy: s.energy + '%', energyW: Math.round(52 * s.energy / 100),
      anim: s.anim, shadowAnim: s.sh, mood: s.mood, bearAlt: s.alt,
      isThriving: st === 'thriving', isHappy: st === 'happy', isTired: st === 'tired', isNeglected: st === 'neglected', isSleep: st === 'sleep'
    };
  }
}
</script>
</body>
</html>
